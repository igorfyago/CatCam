<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>CatCam: a very loving cat whose right eye is a camera lens</title>
  <!-- ears -->
  <g stroke="#3D304A" stroke-width="14" stroke-linejoin="round">
    <polygon points="86,210 128,62 232,128" fill="#F6AA64"/>
    <polygon points="426,210 384,62 280,128" fill="#F6AA64"/>
  </g>
  <polygon points="122,178 140,96 204,136" fill="#F78F8C"/>
  <polygon points="390,178 372,96 308,136" fill="#F78F8C"/>
  <!-- chubby head -->
  <ellipse cx="256" cy="292" rx="200" ry="182" fill="#F6AA64" stroke="#3D304A" stroke-width="14"/>
  <!-- muzzle + blush -->
  <ellipse cx="256" cy="360" rx="96" ry="64" fill="#FFECD0"/>
  <ellipse cx="126" cy="324" rx="42" ry="28" fill="#FCBAA8"/>
  <ellipse cx="386" cy="324" rx="42" ry="28" fill="#FCBAA8"/>
  <!-- left eye: glossy -->
  <circle cx="179" cy="245" r="49" fill="#3D304A"/>
  <circle cx="167" cy="233" r="19" fill="#FFFFFF"/>
  <circle cx="201" cy="267" r="9"  fill="#FFFFFF"/>
  <!-- right eye: the lens, twinkling to match -->
  <circle cx="338" cy="248" r="54" fill="#3D304A"/>
  <circle cx="338" cy="248" r="42" fill="#6B6085"/>
  <circle cx="338" cy="248" r="30" fill="#3D304A"/>
  <circle cx="333" cy="241" r="15" fill="#FFFFFF"/>
  <g fill="#F78F8C"><!-- tiny heart reflected in the glass -->
    <circle cx="343.5" cy="260.4" r="4.5"/>
    <circle cx="352.5" cy="260.4" r="4.5"/>
    <polygon points="339.2,262.4 356.8,262.4 348,273.5"/>
  </g>
  <!-- nose, smile, blep -->
  <polygon points="240,336 272,336 256,354" fill="#F78F8C"/>
  <g fill="none" stroke="#3D304A" stroke-width="10" stroke-linecap="round">
    <path d="M255 362 A 15 18 0 0 1 227 362"/>
    <path d="M285 362 A 15 18 0 0 1 257 362"/>
  </g>
  <ellipse cx="256" cy="377" rx="12" ry="15" fill="#FA787D"/>
  <!-- floating hearts -->
  <g fill="#F0626E">
    <circle cx="439" cy="109.6" r="13"/>
    <circle cx="465" cy="109.6" r="13"/>
    <polygon points="426.5,115.3 477.5,115.3 452,147.3"/>
  </g>
  <g fill="#F78F8C">
    <circle cx="400.5" cy="56" r="7.5"/>
    <circle cx="415.5" cy="56" r="7.5"/>
    <polygon points="393.3,59.3 422.7,59.3 408,77.8"/>
  </g>
  <!-- whiskers -->
  <g stroke="#3D304A" stroke-width="10" stroke-linecap="round">
    <line x1="114" y1="304" x2="28"  y2="296"/>
    <line x1="114" y1="324" x2="28"  y2="328"/>
    <line x1="114" y1="344" x2="28"  y2="360"/>
    <line x1="398" y1="304" x2="484" y2="296"/>
    <line x1="398" y1="324" x2="484" y2="328"/>
    <line x1="398" y1="344" x2="484" y2="360"/>
  </g>
</svg>
